name: Sovereign Release Adjudication (Rule ZCC-EF-0)

on:
  workflow_dispatch:
    inputs:
      producer_repo:
        description: 'Producer repository'
        required: false
        default: 'invariantzkaedi/zcc-bootstrap-compiler'
      producer_commit_sha:
        description: 'Target ZCC compiler commit SHA under evaluation'
        required: false
        type: string
      producer_run_id:
        description: 'GitHub Actions run ID of the producer build'
        required: false
        type: string
      expected_bundle_sha256:
        description: 'Optional expected SHA-256 digest of evidence bundle'
        required: false
        type: string
  push:
    branches: [ main ]
  repository_dispatch:
    types: [adjudicate-zcc-release]

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  adjudicate:
    name: Independent Sovereign Adjudication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Sovereign Authority (Trusted Context)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Authority Self-Integrity (V4-M5-13 Enforced)
        run: |
          set -euo pipefail
          echo "=== ENFORCING AUTHORITY REPOSITORY INTEGRITY ==="
          EXPECTED_VERIFIER_SHA="3f748bf392493d9d68981078829d3826656103e5cb85047c22ba2780ac95c5e9"
          EXPECTED_POLICY_SHA="a325a13894b50599bbdac958a1798eecef7d6f008a520ff3c3d8e2c25f9f88a5"
          
          echo "$EXPECTED_VERIFIER_SHA  sovereign_release_verifier.py" | sha256sum -c -
          echo "$EXPECTED_POLICY_SHA  sovereign_release_policy.json" | sha256sum -c -
          echo "✓ Authority verifier and policy strictly verified against approved cryptographic roots"

      - name: Download & Ingest Untrusted Evidence Bundle (V4-M5-11 & V4-M5-12)
        id: ingest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== RETRIEVING UNTRUSTED EVIDENCE BUNDLE FROM PRODUCER RUN ==="
          mkdir -p untrusted_download
          
          PRODUCER_REPO="${{ github.event.inputs.producer_repo }}"
          if [[ -z "$PRODUCER_REPO" ]]; then
            PRODUCER_REPO="invariantzkaedi/zcc-bootstrap-compiler"
          fi
          
          PRODUCER_COMMIT="${{ github.event.inputs.producer_commit_sha }}"
          PRODUCER_RUN_ID="${{ github.event.inputs.producer_run_id }}"
          
          # Dynamic Discovery: if run ID or commit omitted, resolve latest successful release build
          if [[ -z "$PRODUCER_RUN_ID" || -z "$PRODUCER_COMMIT" ]]; then
            echo "Inputs omitted; dynamically querying latest successful meta-verification run on main from $PRODUCER_REPO..."
            LATEST_RUN_JSON=$(gh api "/repos/$PRODUCER_REPO/actions/workflows/harness-meta-verification.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0]')
            PRODUCER_RUN_ID=$(echo "$LATEST_RUN_JSON" | jq -r '.id')
            PRODUCER_COMMIT=$(echo "$LATEST_RUN_JSON" | jq -r '.head_sha')
            echo "Dynamically resolved target producer run:"
            echo "  Run ID: $PRODUCER_RUN_ID"
            echo "  Commit: $PRODUCER_COMMIT"
          fi
          
          echo "Target Producer Repo:   $PRODUCER_REPO"
          echo "Target Producer Run:    $PRODUCER_RUN_ID"
          echo "Target Producer Commit: $PRODUCER_COMMIT"
          
          # Query artifact metadata and download zip
          ARTIFACT_JSON=$(gh api "/repos/$PRODUCER_REPO/actions/runs/$PRODUCER_RUN_ID/artifacts" --jq '.artifacts[0]')
          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '.id')
          ARTIFACT_NAME=$(echo "$ARTIFACT_JSON" | jq -r '.name')
          
          echo "Fetching artifact ID $ARTIFACT_ID ($ARTIFACT_NAME)..."
          gh api "/repos/$PRODUCER_REPO/actions/artifacts/$ARTIFACT_ID/zip" > untrusted_download/bundle.zip
          ACTUAL_ARTIFACT_SHA=$(sha256sum untrusted_download/bundle.zip | awk '{print $1}')
          echo "Artifact SHA-256: $ACTUAL_ARTIFACT_SHA"
          
          EXPECTED_SHA="${{ github.event.inputs.expected_bundle_sha256 }}"
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "none" ]]; then
            if [[ "$ACTUAL_ARTIFACT_SHA" != "$EXPECTED_SHA" ]]; then
              echo "FATAL: Evidence bundle digest mismatch! $ACTUAL_ARTIFACT_SHA != expected $EXPECTED_SHA" >&2
              exit 1
            fi
            echo "✓ Bundle digest confirmed matching expected SHA-256"
          fi
          
          unzip -q untrusted_download/bundle.zip -d untrusted_download/
          rm -f untrusted_download/bundle.zip
          
          ls -laR untrusted_download/
          
          # Locate bundle archive or evidence files
          BUNDLE_ARCHIVE=$(find untrusted_download -name "*bundle*.tar.gz" -o -name "untrusted_evidence_bundle.tar.gz" | head -n 1 || true)
          if [[ -n "$BUNDLE_ARCHIVE" && -f "$BUNDLE_ARCHIVE" ]]; then
            echo "Found bundle archive: $BUNDLE_ARCHIVE"
            echo "EVAL_ARGS=--bundle $BUNDLE_ARCHIVE" >> $GITHUB_ENV
          else
            EVIDENCE_DIR=$(find untrusted_download -type d -name "replay_bundle" | head -n 1 || true)
            if [[ -z "$EVIDENCE_DIR" ]]; then
              EVIDENCE_DIR=$(find untrusted_download -type d -name "latest" | head -n 1 || true)
            fi
            if [[ -z "$EVIDENCE_DIR" ]]; then
              EVIDENCE_DIR="untrusted_download"
            fi
            echo "Found evidence directory: $EVIDENCE_DIR"
            EVAL_ARGS="--evidence $EVIDENCE_DIR"
            
            LOG_FILE=$(find untrusted_download -type f -name "meta_verification.log" | head -n 1 || true)
            if [[ -n "$LOG_FILE" && -f "$LOG_FILE" ]]; then
              echo "Found execution log: $LOG_FILE"
              EVAL_ARGS="$EVAL_ARGS --log $LOG_FILE"
            fi
            
            echo "EVAL_ARGS=$EVAL_ARGS" >> $GITHUB_ENV
          fi
          
          echo "PRODUCER_COMMIT=$PRODUCER_COMMIT" >> $GITHUB_ENV
          echo "PRODUCER_REPO=$PRODUCER_REPO" >> $GITHUB_ENV
          echo "PRODUCER_RUN_ID=$PRODUCER_RUN_ID" >> $GITHUB_ENV
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_ENV
          echo "ACTUAL_ARTIFACT_SHA=$ACTUAL_ARTIFACT_SHA" >> $GITHUB_ENV

      - name: Execute Sovereign Verifier
        id: verifier
        run: |
          set -euo pipefail
          echo "=== EXECUTING SOVEREIGN RELEASE VERIFIER ==="
          python3 sovereign_release_verifier.py \
            --policy sovereign_release_policy.json \
            $EVAL_ARGS \
            --expected-commit "$PRODUCER_COMMIT" \
            --scratch-dir /tmp/auth_scratch
          echo "=== SOVEREIGN RELEASE DECISION: CERTIFIED PASS ==="

      - name: Publish Sovereign Cryptographic Attestation (V4-M5-14)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p verdict
          STATUS="${{ steps.verifier.outcome }}"
          AUTHORITY_COMMIT="$(git rev-parse HEAD)"
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          VERDICT_STRING="$([ "$STATUS" = "success" ] && echo "SOVEREIGN_RELEASE_CERTIFIED" || echo "SOVEREIGN_RELEASE_REJECTED")"
          EXPECTED_VERIFIER_SHA="3f748bf392493d9d68981078829d3826656103e5cb85047c22ba2780ac95c5e9"
          EXPECTED_POLICY_SHA="a325a13894b50599bbdac958a1798eecef7d6f008a520ff3c3d8e2c25f9f88a5"
          
          LINEAGE_PAYLOAD="${PRODUCER_REPO}:${PRODUCER_COMMIT}:${PRODUCER_RUN_ID}:${ARTIFACT_ID}:${ACTUAL_ARTIFACT_SHA}:${AUTHORITY_COMMIT}:${EXPECTED_VERIFIER_SHA}:${EXPECTED_POLICY_SHA}:${VERDICT_STRING}:${TIMESTAMP}"
          LINEAGE_SIGNATURE=$(echo -n "$LINEAGE_PAYLOAD" | sha256sum | awk '{print $1}')
          
          cat << VERDICT > verdict/release_verdict.json
          {
            "authority": "invariantzkaedi/zcc-release-authority",
            "authority_workflow": "adjudicate-release.yml",
            "authority_commit": "$AUTHORITY_COMMIT",
            "authority_verifier_sha256": "$EXPECTED_VERIFIER_SHA",
            "authority_policy_sha256": "$EXPECTED_POLICY_SHA",
            "evaluated_producer_repo": "$PRODUCER_REPO",
            "evaluated_producer_commit": "$PRODUCER_COMMIT",
            "evaluated_producer_run_id": "$PRODUCER_RUN_ID",
            "evaluated_artifact_id": "$ARTIFACT_ID",
            "evaluated_artifact_sha256": "$ACTUAL_ARTIFACT_SHA",
            "verdict": "$VERDICT_STRING",
            "status": "$STATUS",
            "cryptographic_binding_signature": "$LINEAGE_SIGNATURE",
            "adjudication_timestamp": "$TIMESTAMP"
          }
          VERDICT
          cat verdict/release_verdict.json

      - name: Upload Sovereign Adjudication Verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-release-verdict-${{ env.PRODUCER_COMMIT }}
          path: verdict/release_verdict.json
